<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            background-color: #121313;
            justify-content: space-between;
            display: flex;
            flex-direction: row-reverse;
            padding: 16px 32px
        }

        .nav-list {
            display: flex;
            /* kunci utama: ubah list jadi horizontal */
            list-style: none;
            gap: 24px;
            padding: 16px 32px;
        }

        .nav-list>li>a {
            color: white;
            text-decoration: none;
            font-family: sans-serif;
        }

        .nav-list a:hover {
            color: #4A90E2;
        }

         /* Dropdown wrapper */
        .dropdown {
            position: relative;
            /* jadi acuan posisi untuk dropdown-menu */
        }

         /* Menu dropdown, awalnya disembunyikan */
        .dropdown-menu {
            display: none;
            flex-direction: column;
            /* item dropdown disusun ke bawah */
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #444;
            list-style: none;
            min-width: 180px;
            padding: 8px 0;
        }

        .dropdown-menu li a {
            color: white;
            text-decoration: none;
            font-family: sans-serif;
            padding: 10px 16px;
            display: block;
        }

        .dropdown-menu li a:hover {
            background-color: #4A90E2;
        }

        /* Munculkan dropdown saat hover */
        .dropdown:hover .dropdown-menu {
            display: flex;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <ul class="nav-list">
            <li><a href="#">Home</a></li>
            <li class="dropdown">
            <a href="#">Services ▾</a>
            <ul class="dropdown-menu">
            <li><a href="#">Web Design</a></li>
            <li><a href="#">Web Development</a></li>
            <li><a href="#">SEO</a></li>
        </ul>
         </li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">Help</a></li>
        </ul>

        <img src="https://i.pinimg.com/1200x/16/2d/29/162d2933bb643ec2f48e0238ea1e188a.jpg" alt="Logo" width="80px" height="50px">
    </nav>
</body>
